<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schwimmplan</title>
<meta name="theme-color" content="#05203a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #05203a 0%, #071f35 60%, #05203a 100%);
    color: #fff;
    font-family: 'DM Mono', 'Courier New', monospace;
    padding: 0 16px 80px;
  }

  header {
    text-align: center;
    padding: 36px 0 24px;
  }
  .logo { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .logo span { color: #00c8ff; }
  .tagline { font-size: 0.65rem; color: rgba(255,255,255,0.35); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 6px; }

  .upload-zone {
    border: 1.5px dashed rgba(0,200,255,0.3);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    background: rgba(0,200,255,0.03);
    margin-bottom: 20px;
    transition: all 0.2s;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: #00c8ff;
    background: rgba(0,200,255,0.08);
  }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 2rem; margin-bottom: 8px; }
  .upload-label { font-size: 0.85rem; color: rgba(255,255,255,0.6); }
  .upload-label strong { color: #00c8ff; }

  .error-box {
    background: rgba(255,80,80,0.1);
    border: 1px solid rgba(255,80,80,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.78rem;
    color: #ff8080;
    margin-bottom: 16px;
    display: none;
  }

  .section-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    background: rgba(255,209,102,0.15);
    border: 1px solid rgba(255,209,102,0.4);
    color: #ffd166;
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .chip.off { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.4); }
  .chip-x { font-size: 0.7rem; opacity: 0.6; }

  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-family: inherit;
    font-size: 0.8rem;
    outline: none;
  }
  .add-row input:focus { border-color: #00c8ff; }
  .add-row input::placeholder { color: rgba(255,255,255,0.25); }
  .btn-add {
    background: #00c8ff;
    color: #05203a;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
  }

  .loading { text-align: center; padding: 40px; color: #00c8ff; font-size: 0.8rem; letter-spacing: 0.08em; display: none; }

  .info-bar {
    background: rgba(0,200,255,0.08);
    border: 1px solid rgba(0,200,255,0.15);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .info-bar .comp-name { color: #fff; font-weight: 500; }
  .info-bar span:last-child { text-align: right; flex-shrink: 0; }

  .results-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .results-title { font-size: 1.05rem; font-style: italic; color: rgba(255,255,255,0.7); }
  .results-count { font-size: 0.7rem; color: #00c8ff; }

  .swimmer-block { margin-bottom: 24px; }
  .swimmer-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 0 4px; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00c8ff, #0077b6);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 500; color: #05203a;
    flex-shrink: 0;
  }
  .swimmer-name { font-size: 1.05rem; font-weight: 700; }
  .swimmer-sub { font-size: 0.68rem; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; }

  .start-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 12px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .lane-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .start-time { font-size: 0.82rem; color: #00c8ff; }
  .start-time small { display: block; font-size: 0.58rem; color: rgba(255,255,255,0.3); letter-spacing: 0.08em; }
  .start-event { font-size: 0.82rem; font-weight: 500; }
  .start-meta { font-size: 0.68rem; color: rgba(255,255,255,0.4); margin-top: 2px; letter-spacing: 0.05em; }
  .lane-num { font-size: 1.5rem; font-weight: 700; line-height: 1; text-align: right; }
  .lane-label { font-size: 0.55rem; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; text-transform: uppercase; text-align: right; }

  .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); margin: 4px 0 20px; }
  .day-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: #00c8ff; margin: 16px 0 8px 4px; padding: 4px 10px; background: rgba(0,200,255,0.08); border-radius: 20px; display: inline-block; }

  .round-badge { font-size: 0.58rem; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: #ffd166; border: 1px solid rgba(255,209,102,0.4); border-radius: 10px; padding: 1px 6px; margin-left: 4px; vertical-align: middle; white-space: nowrap; }
  .follow-up { font-size: 0.64rem; color: rgba(255,209,102,0.75); margin-top: 4px; }

  /* Countdown / nächster Start */
  .next-wrap { margin-bottom: 8px; }
  .next-label { display: flex; justify-content: space-between; align-items: center; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: #00c8ff; margin: 6px 4px 6px; }
  .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; box-shadow: 0 0 0 4px rgba(0,200,255,0.18); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .start-card.next { margin-bottom: 0; background: linear-gradient(135deg, rgba(0,200,255,0.16), rgba(0,200,255,0.05)); border-color: rgba(0,200,255,0.6); box-shadow: 0 0 24px rgba(0,200,255,0.18); }
  .countdown { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 6px; margin-top: 2px; padding-top: 10px; border-top: 1px solid rgba(0,200,255,0.2); }
  .cd-in { font-size: 0.66rem; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; text-transform: uppercase; }
  .cd-num, .cd-now { font-size: 1.5rem; font-weight: 700; color: #fff; line-height: 1; }
  .cd-unit { font-size: 0.72rem; color: rgba(255,255,255,0.6); margin-right: 6px; }
  .next-wrap.soon .next-label { color: #ffd166; }
  .next-wrap.soon .pulse { box-shadow: 0 0 0 4px rgba(255,209,102,0.2); }
  .start-card.next.soon { background: linear-gradient(135deg, rgba(255,209,102,0.18), rgba(255,209,102,0.05)); border-color: rgba(255,209,102,0.7); box-shadow: 0 0 24px rgba(255,209,102,0.2); }
  .start-card.soon .countdown { border-top-color: rgba(255,209,102,0.3); }
  .next-wrap.now .next-label { color: #06d6a0; }
  .next-wrap.now .pulse { box-shadow: 0 0 0 4px rgba(6,214,160,0.22); }
  .start-card.next.now { background: linear-gradient(135deg, rgba(6,214,160,0.2), rgba(6,214,160,0.06)); border-color: rgba(6,214,160,0.75); box-shadow: 0 0 24px rgba(6,214,160,0.22); }
  .start-card.now .countdown { border-top-color: rgba(6,214,160,0.3); }
  .start-card.past { opacity: 0.38; }
  .past-tag { font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); text-align: right; white-space: nowrap; }

  .empty-state { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.25); font-size: 0.8rem; line-height: 1.8; }
  .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }

  #results { margin-top: 4px; }

  .presets-section { margin-bottom: 20px; }
  .preset-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 8px; cursor: pointer;
    font-family: inherit; color: #fff; text-align: left;
    transition: background 0.15s;
  }
  .preset-btn:hover { background: rgba(0,200,255,0.08); border-color: rgba(0,200,255,0.3); }
  .preset-btn.active { background: rgba(0,200,255,0.12); border-color: rgba(0,200,255,0.5); }
  .preset-name { font-size: 0.82rem; font-weight: 500; }
  .preset-date { font-size: 0.68rem; color: rgba(255,255,255,0.4); margin-top: 3px; }
  .preset-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
  .preset-row .preset-btn { margin-bottom: 0; flex: 1; min-width: 0; }
  .preset-del {
    flex-shrink: 0; width: 44px; border-radius: 10px; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.4); font-size: 0.8rem;
  }
  .preset-del:hover { color: #ff8080; border-color: rgba(255,80,80,0.4); background: rgba(255,80,80,0.08); }
  .preset-arrow { color: #00c8ff; font-size: 0.9rem; flex-shrink: 0; margin-left: 12px; }
</style>
</head>
<body>

<header>
  <div class="logo">Schwimm<span>plan</span></div>
  <div class="tagline">Meldeergebnis auf einen Blick &nbsp;·&nbsp; v7</div>
</header>

<div class="presets-section" id="presetsSection">
  <div class="section-label">Gespeicherte Wettkämpfe</div>
  <div id="presetList"></div>
</div>

<div class="section-label" style="margin-bottom:10px">Eigene PDF hochladen</div>
<div class="upload-zone" id="uploadZone">
  <input type="file" accept="application/pdf" id="fileInput" />
  <div class="upload-icon">🏊</div>
  <div class="upload-label"><strong>PDF hochladen</strong><br>Meldeergebnis antippen oder reinziehen</div>
</div>

<div class="error-box" id="errorBox"></div>
<div class="loading" id="loading">PDF wird gelesen…</div>

<div style="margin-bottom:20px">
  <div class="section-label">Meine Kinder</div>
  <div class="chips" id="chips"></div>
  <div class="add-row">
    <input type="text" id="nameInput" placeholder="Name eingeben…" />
    <button class="btn-add" onclick="addName()">+ Hinzufügen</button>
  </div>
</div>

<div id="results">
  <div class="empty-state">
    <span class="empty-icon">📄</span>
    PDF hochladen und Namen eingeben,<br>dann werden die Starts angezeigt.
  </div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const LANE_COLORS = {
    0:'#7b8cde', 1:'#0077b6', 2:'#0096c7', 3:'#00b4d8', 4:'#48cae4',
    5:'#90e0ef', 6:'#06d6a0', 7:'#8ac926', 8:'#ffd166', 9:'#f4a261'
  };

  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // ── Gespeicherte Wettkämpfe ─────────────────────────────────────────────────
  // Hochgeladene PDFs werden lokal im Browser (IndexedDB) gespeichert – sie verlassen
  // das Gerät nicht. Zusätzlich wird das Parse-Ergebnis abgelegt, damit das Öffnen
  // schnell geht; ändert sich der Parser, PARSER_VERSION hochzählen → neu einlesen.
  const PARSER_VERSION = 1;

  // Optional: PDFs neben index.html legen und hier eintragen, z. B.
  // { name: 'Wettkampfname', subtitle: 'Ort · Datum', file: 'datei.pdf' }
  // Achtung: alles im Repo ist über GitHub Pages öffentlich.
  const PRESETS = [];

  const store = {
    db: null,
    open() {
      if (this.db) return this.db;
      this.db = new Promise((resolve, reject) => {
        const req = indexedDB.open('schwimmplan', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('competitions', { keyPath: 'id' });
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
      return this.db;
    },
    async run(mode, fn) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction('competitions', mode);
        const req = fn(tx.objectStore('competitions'));
        tx.oncomplete = () => resolve(req && req.result);
        tx.onerror    = () => reject(tx.error);
        tx.onabort    = () => reject(tx.error);
      });
    },
    all()     { return this.run('readonly',  os => os.getAll()); },
    get(id)   { return this.run('readonly',  os => os.get(id)); },
    put(rec)  { return this.run('readwrite', os => os.put(rec)); },
    del(id)   { return this.run('readwrite', os => os.delete(id)); },
  };

  let savedComps = [];     // Metadaten der gespeicherten Uploads (ohne PDF-Daten)
  let activeId   = null;   // 'preset:<i>' oder 'upload:<key>'

  function compList() {
    const presets = PRESETS.map((p, i) => ({ id: 'preset:' + i, name: p.name, subtitle: p.subtitle, preset: true }));
    const uploads = [...savedComps]
      .sort((a, b) => b.addedAt - a.addedAt)
      .map(c => ({ id: c.id, name: c.name, subtitle: c.date || c.fileName, preset: false }));
    return [...uploads, ...presets];
  }

  function renderPresets() {
    const list = compList();
    document.getElementById('presetsSection').style.display = list.length ? '' : 'none';
    const container = document.getElementById('presetList');
    container.innerHTML = list.map(c => `
      <div class="preset-row">
        <button class="preset-btn ${activeId === c.id ? 'active' : ''}" data-open="${esc(c.id)}">
          <div>
            <div class="preset-name">${esc(c.name)}</div>
            <div class="preset-date">${esc(c.subtitle)}</div>
          </div>
          <span class="preset-arrow">${activeId === c.id ? '✓' : '→'}</span>
        </button>
        ${c.preset ? '' : `<button class="preset-del" data-del="${esc(c.id)}" title="Löschen" aria-label="${esc(c.name)} löschen">✕</button>`}
      </div>
    `).join('');
    container.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openCompetition(b.dataset.open));
    container.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteCompetition(b.dataset.del));
  }

  function setActive(id) {
    activeId = id;
    try { id ? localStorage.setItem('schwimmplan_active', id) : localStorage.removeItem('schwimmplan_active'); } catch (e) {}
    renderPresets();
  }

  async function withLoading(fn) {
    showError('');
    document.getElementById('loading').style.display = 'block';
    document.getElementById('results').innerHTML = '';
    allStarts = [];
    try {
      await fn();
    } catch (err) {
      showError('Fehler: ' + err.message);
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  function showParsed(parsed) {
    competitionInfo = parsed.competition;
    allStarts       = parsed.starts;
    renderResults();
  }

  async function parseBuffer(buffer) {
    const parsed = parseEasyWk(await extractTextFromBuffer(buffer));
    if (parsed.starts.length === 0)
      throw new Error('Keine Starts gefunden – ist das eine EasyWk-Meldeergebnis-PDF?');
    return parsed;
  }

  function openCompetition(id) {
    setActive(id);
    return withLoading(async () => {
      if (id.startsWith('preset:')) {
        const preset = PRESETS[parseInt(id.slice(7))];
        if (!preset) throw new Error('Wettkampf nicht gefunden.');
        const response = await fetch(preset.file);
        if (!response.ok) throw new Error('Datei nicht gefunden: ' + preset.file);
        showParsed(await parseBuffer(await response.arrayBuffer()));
        return;
      }
      const rec = await store.get(id);
      if (!rec) { setActive(null); throw new Error('Gespeicherter Wettkampf nicht mehr vorhanden.'); }
      if (rec.parserVersion !== PARSER_VERSION || !rec.parsed) {
        rec.parsed = await parseBuffer(rec.pdf.slice(0));
        rec.parserVersion = PARSER_VERSION;
        store.put(rec).catch(() => {});
      }
      showParsed(rec.parsed);
    });
  }

  async function deleteCompetition(id) {
    const comp = savedComps.find(c => c.id === id);
    if (!comp || !confirm(`„${comp.name}“ vom Gerät löschen?`)) return;
    try { await store.del(id); } catch (e) {}
    savedComps = savedComps.filter(c => c.id !== id);
    if (activeId === id) {
      setActive(null);
      allStarts = [];
      document.getElementById('results').innerHTML = EMPTY_HTML;
    } else {
      renderPresets();
    }
  }

  async function loadSavedList() {
    try {
      const all = await store.all();
      savedComps = all.map(({ pdf, parsed, ...meta }) => meta);
    } catch (e) {
      savedComps = [];   // z. B. privates Fenster ohne IndexedDB – App läuft trotzdem
    }
  }

  const EMPTY_HTML = document.getElementById('results').innerHTML;

  let names = [];
  let activeNames = new Set(names);
  let allStarts = [];
  let competitionInfo = {};

  // ── Upload ──────────────────────────────────────────────────────────────────
  const uploadZone = document.getElementById('uploadZone');
  const fileInput  = document.getElementById('fileInput');

  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
  uploadZone.addEventListener('dragover',  e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.classList.remove('drag-over');
    handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) { showError('Bitte eine PDF-Datei hochladen.'); return; }
    processPDF(file);
  }

  // ── PDF.js text extraction ──────────────────────────────────────────────────


  // ── EasyWk parser ───────────────────────────────────────────────────────────
  const GENDER_RE = /\s*\b(m[äa]nnlich|weiblich|mixed)\b\s*/i;

  // "50m Brust männlich (Vorlauf) (10 Läufe) (ca. 09:15 Uhr)"
  //   → { base: '50m Brust', gender: 'männlich', round: 'Vorlauf', time: '09:15' }
  function parseEventTitle(title) {
    let rest = title.trim();
    let time = '';
    const t = rest.match(/\s*\(ca\.\s*(\d{1,2}:\d{2})\s*Uhr\)\s*$/);
    if (t) { time = t[1]; rest = rest.slice(0, t.index); }
    rest = rest.replace(/\s*\(\d+\s*L[äa]ufe?\)\s*$/, '');
    let round = '';
    const r = rest.match(/\s*\(([^()]+)\)\s*$/);
    if (r) { round = r[1].trim(); rest = rest.slice(0, r.index); }
    const g = rest.match(GENDER_RE);
    const gender = g ? g[1].toLowerCase() : '';
    const base = rest.replace(GENDER_RE, ' ').replace(/\s+/g, ' ').trim();
    return { base, gender, round, time };
  }

  // Key used to connect a Vorlauf with its Finale(s): "50m Brust|männlich".
  // Only distance + stroke, so "25m Freistil SpeedRace" matches "25m Freistil (SpeedRace Finale)".
  function followUpKey(ev) {
    return ev.base.split(' ').slice(0, 2).join(' ').toLowerCase() + '|' + ev.gender;
  }

  function parseCompetitionHeader(lines) {
    const competition = {};
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^(.*?)\s*\bvom\s+(\d{2}\.\d{2}\.\d{4})(?:\s+bis\s+(\d{2}\.\d{2}\.\d{4}))?/);
      if (!m) continue;
      const name = m[1] || lines[i - 1] || '';
      if (!name || /Meldeergebnis/i.test(name)) continue;
      competition.name = name.trim();
      competition.date = m[3] && m[3] !== m[2] ? `${m[2]} – ${m[3]}` : m[2];
      break;
    }
    return competition;
  }

  function parseEasyWk(text) {
    const lines = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
    const competition = parseCompetitionHeader(lines);

    const starts  = [];
    const program = [];            // Wettkampffolge in Dokument-Reihenfolge (erste Nennung je WK)
    const seenWk  = new Set();
    let currentWk      = null;
    let currentHeat    = '';
    let currentTime    = '';
    let currentDay     = '';
    let currentSection = 0;

    for (const line of lines) {
      // Abschnitt/day header: "Abschnitt 1 - Samstag 26.09.2026"
      const abschnitt = line.match(/^Abschnitt\s+(\d+)\s*[-–]\s*(\S+\s+\d{2}\.\d{2}\.\d{4})/);
      if (abschnitt) { currentSection = parseInt(abschnitt[1]); currentDay = abschnitt[2]; continue; }

      // Wettkampf header: "Wettkampf 5 - 50m Schmetterling männlich (Vorlauf) (6 Läufe) (ca. 10:26 Uhr)"
      const wk = line.match(/^Wettkampf\s+(\d+)\s*[-–]\s*(.+)$/);
      if (wk) {
        const nr = parseInt(wk[1]);
        currentWk = { nr, ...parseEventTitle(wk[2]), day: currentDay, section: currentSection };
        if (!seenWk.has(nr)) { seenWk.add(nr); program.push(currentWk); }
        continue;
      }

      // Heat header: "Lauf 3/7 - ca. 09:42 Uhr"
      const heat = line.match(/Lauf\s+(\d+)\/(\d+)\s*[-–]\s*ca\.\s*(\d{1,2}:\d{2})\s*Uhr/);
      if (heat) {
        currentHeat = `${heat[1]}/${heat[2]}`;
        currentTime = heat[3];
        continue;
      }

      // Format A: "Bahn 3 Torenius Schiller (M) 2016 SC Poseidon Berlin 00:57,66"
      // Format B: "Bahn 1   Schiller, Torenius   2016   SC Poseidon Berlin   00:48,30"
      // Format C: "Bahn 3   Yannick Schroeter   2003 | S10   SV Berolina   3,5,H,12+   02:47,07"
      const bahnA = line.match(/^Bahn\s+(\d+)\s+(.+?)\s+\((W|M)\)\s+(\d{4})\s+(.+?)\s+(\d{2}:\d{2},\d{2})$/);
      const bahnB = !bahnA && line.match(/^Bahn\s+(\d+)\s+([A-ZÀ-ÿa-z][^,]+,[^\d]+?)\s+(\d{4})\s+(.+?)\s+(\d{2}:\d{2},\d{2})$/);
      const bahnC = !bahnA && !bahnB && line.match(/^Bahn\s+(\d+)\s+(.+?)\s+(\d{4})(?:\s*\|\s*\S+)?\s+(.+?)\s+(\d{2}:\d{2},\d{2})$/);
      if ((bahnA || bahnB || bahnC) && currentWk) {
        const b = bahnA || bahnB || bahnC;
        let rawName = b[2].trim();
        if (rawName.includes(',')) {
          const parts = rawName.split(',');
          rawName = parts[1].trim() + ' ' + parts[0].trim();
        }
        // Exceptions-Spalte (z. B. "3,5,H,12+") vom Vereinsnamen trennen
        const club = (bahnA ? bahnA[5] : (bahnB ? bahnB[4] : bahnC[4]))
          .replace(/\s+[\dA-Z+]+(?:,[\dA-Z+]+)+$/, '').trim();
        starts.push({
          laneNum:       parseInt(b[1]),
          name:          rawName,
          gender:        bahnA ? bahnA[3] : '',
          jg:            bahnA ? bahnA[4] : (bahnB ? bahnB[3] : bahnC[3]),
          club,
          meldezeit:     bahnA ? bahnA[6] : (bahnB ? bahnB[5] : bahnC[5]),
          event:         currentWk.base,
          round:         currentWk.round,
          wettkampfNr:   currentWk.nr,
          heat:          currentHeat,
          time:          currentTime,
          day:           currentDay,
          section:       currentSection,
          followUps:     [],
        });
      }
    }

    attachFollowUps(starts, program);
    return { competition, starts };
  }

  // Finals and further rounds are listed in the Wettkampffolge without heats (the
  // qualified swimmers are not known yet). For every Vorlauf start we look them up
  // in the same Abschnitt and estimate the time window from the neighbouring events.
  function attachFollowUps(starts, program) {
    const withEntries = new Set(starts.map(s => s.wettkampfNr));
    const byNr = new Map(program.map(ev => [ev.nr, ev]));

    starts.forEach(s => {
      if (!/vorlauf/i.test(s.round)) return;
      const heat = byNr.get(s.wettkampfNr);
      if (!heat) return;
      const key = followUpKey(heat);
      const seenKinds = new Set();
      program.forEach((ev, idx) => {
        if (ev === heat || ev.section !== heat.section || withEntries.has(ev.nr)) return;
        if (!ev.round || /vorlauf/i.test(ev.round) || followUpKey(ev) !== key) return;
        // Only the first of "1. Runde", "2. Runde", … – the rest follows directly after.
        const kind = ev.round.replace(/\d+\.?\s*/g, '').toLowerCase();
        if (seenKinds.has(kind)) return;
        seenKinds.add(kind);

        let from = '', to = '';
        for (let i = idx - 1; i >= 0 && program[i].section === ev.section; i--)
          if (program[i].time) { from = program[i].time; break; }
        for (let i = idx + 1; i < program.length && program[i].section === ev.section; i++)
          if (program[i].time) { to = program[i].time; break; }

        const extra = ev.base.split(' ').slice(2).join(' ');
        s.followUps.push({ nr: ev.nr, label: extra ? `${extra} (${ev.round})` : ev.round, from, to });
      });
    });
  }

  // ── Main processing ─────────────────────────────────────────────────────────
  async function extractTextFromBuffer(buffer) {
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    const allLines = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page    = await pdf.getPage(p);
      const content = await page.getTextContent();
      const byY = new Map();
      for (const item of content.items) {
        const y = Math.round(item.transform[5]);
        if (!byY.has(y)) byY.set(y, []);
        byY.get(y).push({ x: item.transform[4], str: item.str });
      }
      const sortedYs = [...byY.keys()].sort((a, b) => b - a);
      for (const y of sortedYs) {
        const items = byY.get(y).sort((a, b) => a.x - b.x);
        allLines.push(items.map(i => i.str).join(' '));
      }
    }
    return allLines.join('\n');
  }

  async function processPDF(file) {
    setActive(null);
    await withLoading(async () => {
      const buffer = await file.arrayBuffer();
      const parsed = await parseBuffer(buffer.slice(0));   // PDF.js übernimmt den Buffer
      showParsed(parsed);

      const c   = parsed.competition;
      const key = c.name ? `${c.name}|${c.date || ''}` : `${file.name}|${file.size}`;
      const rec = {
        id: 'upload:' + key,
        name: c.name || file.name.replace(/\.pdf$/i, ''),
        date: c.date || '',
        fileName: file.name,
        addedAt: Date.now(),
        parserVersion: PARSER_VERSION,
        parsed,
        pdf: buffer,
      };
      try {
        await store.put(rec);
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        const { pdf, parsed: _p, ...meta } = rec;
        savedComps = [...savedComps.filter(x => x.id !== rec.id), meta];
        setActive(rec.id);
      } catch (e) {
        showError('Hinweis: Die PDF konnte auf diesem Gerät nicht gespeichert werden (privates Fenster?).');
      }
    });
  }

  // ── Name chips ──────────────────────────────────────────────────────────────
  function renderChips() {
    const container = document.getElementById('chips');
    container.innerHTML = '';
    names.forEach(n => {
      const div = document.createElement('div');
      div.className = 'chip' + (activeNames.has(n) ? '' : ' off');
      div.innerHTML = `${esc(n)} <span class="chip-x">✕</span>`;
      div.querySelector('.chip-x').onclick = e => { e.stopPropagation(); removeName(n); };
      div.onclick = () => toggleName(n);
      container.appendChild(div);
    });
  }

  function saveNames() {
    localStorage.setItem('schwimmplan_names', JSON.stringify(names));
  }

  function addName() {
    const input = document.getElementById('nameInput');
    const val   = input.value.trim();
    if (val && !names.includes(val)) {
      names.push(val);
      activeNames.add(val);
      saveNames();
      renderChips();
      renderResults();
    }
    input.value = '';
    input.focus();
  }

  function removeName(n) {
    names = names.filter(x => x !== n);
    activeNames.delete(n);
    saveNames();
    renderChips();
    renderResults();
  }

  function toggleName(n) {
    activeNames.has(n) ? activeNames.delete(n) : activeNames.add(n);
    renderChips();
    renderResults();
  }

  document.getElementById('nameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addName();
  });

  // ── Render results ──────────────────────────────────────────────────────────
  function timeToMin(t) {
    if (!t) return 9999;
    const m = t.match(/(\d{1,2}):(\d{2})/);
    return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : 9999;
  }

  // ── Countdown ──────────────────────────────────────────────────────────────
  const SOON_MIN = 30;   // ab hier gelb „Gleich dran“
  const NOW_MIN  = 10;   // so lange nach der ca.-Zeit bleibt „Jetzt dran“ stehen

  // Absoluter Zeitpunkt eines Starts (ms) aus Tag ("Samstag 26.09.2026") bzw.
  // Wettkampfdatum und ca.-Uhrzeit; null wenn nicht bestimmbar.
  function startAt(s) {
    const d = (s.day || competitionInfo.date || '').match(/(\d{2})\.(\d{2})\.(\d{4})/);
    const t = (s.time || '').match(/(\d{1,2}):(\d{2})/);
    if (!d || !t) return null;
    return new Date(+d[3], +d[2] - 1, +d[1], +t[1], +t[2]).getTime();
  }

  // Markiert pro Kind vergangene Starts und den nächsten (state: next | soon | now).
  function countdownStates(starts, now) {
    const states = new Map();
    let found = false;
    for (const s of starts) {
      const at = startAt(s);
      if (at === null || found) continue;
      if (now >= at + NOW_MIN * 60000) { states.set(s, { past: true }); continue; }
      found = true;
      const mins = Math.ceil((at - now) / 60000);
      states.set(s, { state: mins <= 0 ? 'now' : mins <= SOON_MIN ? 'soon' : 'next', mins });
    }
    return states;
  }

  function countdownHtml(mins) {
    const d = Math.floor(mins / 1440), h = Math.floor(mins % 1440 / 60), m = mins % 60;
    const part = (n, u) => `<span class="cd-num">${n}</span><span class="cd-unit">${u}</span>`;
    let out = '';
    if (d) out += part(d, d === 1 ? 'Tag' : 'Tage');
    if (d || h) out += part(h, 'Std');
    out += part(m, 'Min');
    return `<span class="cd-in">in</span>${out}`;
  }

  const NEXT_LABEL = { next: 'Nächster Start', soon: 'Gleich dran', now: 'Jetzt dran' };

  function renderStartCard(s, cd) {
    const card = renderStartCardInner(s, cd);
    if (!cd || cd.past) return card;
    return `<div class="next-wrap ${cd.state}">
      <div class="next-label"><span><span class="pulse"></span>${NEXT_LABEL[cd.state]}</span><span>Bahn ${s.laneNum}</span></div>
      ${card}
    </div>`;
  }

  function renderStartCardInner(s, cd) {
    const color = LANE_COLORS[s.laneNum] || '#00c8ff';
    const mz    = s.meldezeit && s.meldezeit !== '00:00,00' ? ` · ${esc(s.meldezeit)}` : '';
    const round = s.round ? ` <span class="round-badge">${esc(s.round)}</span>` : '';
    const follow = s.followUps.map(f => {
      const win = f.from && f.to ? `ca. ${f.from}–${f.to} Uhr` : (f.from ? `nach ca. ${f.from} Uhr` : '');
      return `<div class="follow-up">↳ ggf. WK ${f.nr} · ${esc(f.label)}${win ? ' · ' + win : ''}</div>`;
    }).join('');
    const cls = !cd ? '' : cd.past ? ' past' : ` next ${cd.state}`;
    const right = cd && cd.past
      ? `<div class="past-tag">✓ vorbei</div>`
      : `<div class="lane-num" style="color:${color}">${s.laneNum}</div>
        <div class="lane-label">Bahn</div>`;
    const countdown = cd && !cd.past
      ? `<div class="countdown">${cd.state === 'now' ? '<span class="cd-now">Jetzt</span>' : countdownHtml(cd.mins)}</div>`
      : '';
    return `<div class="start-card${cls}">
      <div class="lane-bar" style="background:${color}"></div>
      <div class="start-time"><small>ca.</small>${esc(s.time)} Uhr</div>
      <div>
        <div class="start-event">${esc(s.event)}${round}</div>
        <div class="start-meta">WK ${s.wettkampfNr} · Lauf ${esc(s.heat)}${mz}</div>
        ${follow}
      </div>
      <div>
        ${right}
      </div>
      ${countdown}
    </div>`;
  }

  function renderResults() {
    const area = document.getElementById('results');
    if (allStarts.length === 0) return;

    // Build swimmer map (keyed by name + Jahrgang, so namesakes stay apart)
    const swimmerMap = new Map();
    allStarts.forEach(s => {
      const matched = [...activeNames].find(n =>
        n.toLowerCase().split(/\s+/).every(part => s.name.toLowerCase().includes(part))
      );
      if (!matched) return;
      const key = s.name + '|' + s.jg;
      if (!swimmerMap.has(key)) swimmerMap.set(key, { name: s.name, jg: s.jg, club: s.club, starts: [] });
      swimmerMap.get(key).starts.push(s);
    });
    swimmerMap.forEach(d => d.starts.sort((a, b) =>
      (a.section - b.section) || (timeToMin(a.time) - timeToMin(b.time))));
    const total = [...swimmerMap.values()].reduce((sum, d) => sum + d.starts.length, 0);

    if (swimmerMap.size === 0) {
      area.innerHTML = `<div class="empty-state"><span class="empty-icon">🔍</span>Keine Starts für die angegebenen Namen gefunden.</div>`;
      return;
    }

    let html = '';

    if (competitionInfo.name) {
      html += `<div class="info-bar"><span class="comp-name">${esc(competitionInfo.name)}</span><span>${esc(competitionInfo.date || '')}</span></div>`;
    }

    html += `<div class="results-header"><div class="results-title">Deine Starts</div><div class="results-count">${total} Start${total !== 1 ? 's' : ''} gesamt</div></div>`;

    const now = Date.now();
    const entries = [...swimmerMap.values()];
    entries.forEach((data, idx) => {
      const cds = countdownStates(data.starts, now);
      const initials = data.name.split(' ').map(w => w[0]).slice(0, 2).join('');

      html += `<div class="swimmer-block">
        <div class="swimmer-header">
          <div class="avatar">${esc(initials)}</div>
          <div>
            <div class="swimmer-name">${esc(data.name)}</div>
            <div class="swimmer-sub">Jahrgang ${esc(data.jg)} · ${esc(data.club)} · ${data.starts.length} Start${data.starts.length !== 1 ? 's' : ''}</div>
          </div>
        </div>`;

      // Group starts by day (starts are already in chronological order)
      const days = [...new Set(data.starts.map(s => s.day))];
      if (days.length > 1) {
        days.forEach(day => {
          if (day) html += `<div class="day-label">${esc(day)}</div>`;
          data.starts.filter(s => s.day === day).forEach(s => { html += renderStartCard(s, cds.get(s)); });
        });
      } else {
        data.starts.forEach(s => { html += renderStartCard(s, cds.get(s)); });
      }

      html += `</div>`;
      if (idx < entries.length - 1) html += `<div class="divider"></div>`;
    });

    area.innerHTML = html;
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  // Restore names from localStorage
  const savedNames = localStorage.getItem('schwimmplan_names');
  if (savedNames) {
    try {
      names = JSON.parse(savedNames);
      activeNames = new Set(names);
    } catch(e) {}
  }

  renderPresets();
  renderChips();

  // Zuletzt geöffneten Wettkampf wiederherstellen
  (async () => {
    await loadSavedList();
    let last = null;
    try { last = localStorage.getItem('schwimmplan_active'); } catch (e) {}
    const exists = last && compList().some(c => c.id === last);
    renderPresets();
    if (exists) openCompetition(last);
  })();

  // Countdown live halten: alle 30 s und sofort beim Zurückkehren in die App
  setInterval(() => { if (!document.hidden) renderResults(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) renderResults(); });
  window.addEventListener('focus', () => renderResults());

  // Offline-Unterstützung (nur über http(s), nicht bei file://)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
