     sonst sieht Google dieses noindex nie und kann die URL trotzdem listen. -->

<style>
  /* Material Design 3, helles Schema (Farben wie in den Google-Apps) */
  :root {
    --surface: #f8fafd; --card: #fff; --sheet: #f0f4f9;
    --on: #1f1f1f; --var: #444746; --outline: #c4c7c5; --line: #e1e3e1;
    --primary: #0b57d0; --on-primary: #fff; --pc: #d3e3fd; --opc: #041e49;
    --sc: #c2e7ff; --osc: #001d35;
    --warn: #ffdf99; --owarn: #3d2e00; --warnacc: #7c5800;
    --ok: #c4eed0; --ook: #072711;
    --err: #f9dedc; --oerr: #410e0b;
    --chip: #e9eef6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh; background: var(--surface); color: var(--on);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .ic { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0; display: block; }
  .ic.s18 { width: 18px; height: 18px; }
  .app { max-width: 640px; margin: 0 auto; padding-bottom: 32px; }
  [hidden] { display: none !important; }

  /* Top-App-Bar */
  .bar { display: flex; align-items: center; height: 64px; padding: 0 4px 0 16px; position: sticky; top: 0; background: var(--surface); z-index: 5; }
  .bar h1 { font-size: 22px; font-weight: 400; flex: 1; }
  .ib { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--var); }
  .ib:active, .ib:hover { background: rgba(68,71,70,0.08); }
  .menu { position: absolute; right: 8px; top: 56px; background: var(--sheet); border-radius: 4px; padding: 8px 0; min-width: 220px; box-shadow: 0 2px 6px 2px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.3); z-index: 20; }
  .menu button, .menu .mitem { display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 12px; font-size: 14px; text-align: left; color: var(--on); }
  .menu button .ic, .menu .mitem .ic { color: var(--var); }
  .menu button:hover, .menu .mitem:hover { background: rgba(31,31,31,0.08); }
  .menu .mitem { cursor: pointer; }

  /* Wettkampf-Auswahl + Filter-Chips */
  .switch { display: inline-flex; align-items: center; gap: 4px; margin: 0 16px 12px; padding: 6px 8px 6px 14px; min-height: 36px; border-radius: 8px; background: var(--chip); font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); text-align: left; }
  .switch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch .ic { color: var(--var); }
  .chips { display: flex; gap: 8px; padding: 0 16px 4px; flex-wrap: wrap; }
  .fc { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 8px; font-size: 14px; font-weight: 500; border: 1px solid var(--outline); color: var(--var); }
  .fc.on { background: var(--sc); color: var(--osc); border-color: transparent; padding-left: 8px; }
  .fc.add { padding-left: 8px; }

  /* Fortschritt, Fehler, Snackbar */
  .prog { height: 4px; background: var(--pc); margin: 12px 16px 0; border-radius: 2px; overflow: hidden; position: relative; }
  .prog i { position: absolute; top: 0; bottom: 0; width: 40%; background: var(--primary); border-radius: 2px; animation: prog 1.4s ease-in-out infinite; }
  @keyframes prog { from { left: -40%; } to { left: 100%; } }
  .prog-text { padding: 12px 20px; font-size: 14px; color: var(--var); }
  .errbox { margin: 12px 16px 0; padding: 14px 16px; border-radius: 12px; background: var(--err); color: var(--oerr); font-size: 14px; line-height: 20px; }
  .snack { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; width: calc(100% - 24px); max-width: 560px; background: #303030; color: #f2f2f2; border-radius: 4px; padding: 14px 16px; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.3); z-index: 30; }

  /* Kind-Abschnitte */
  .sec { margin: 16px 12px 0; }
  .sh { display: flex; align-items: center; gap: 12px; padding: 6px 4px 10px; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; flex-shrink: 0; }
  .av0 { background: #d3e3fd; color: #041e49; } .av1 { background: #ffd8e4; color: #31111d; }
  .av2 { background: #c4eed0; color: #072711; } .av3 { background: #ffdcc2; color: #2e1500; }
  .sh .n { font-size: 16px; font-weight: 500; } .sh .s { font-size: 14px; color: var(--var); }

  /* Countdown-Karte */
  .hero { border-radius: 24px; padding: 18px 20px; margin-bottom: 8px; background: var(--pc); color: var(--opc); }
  .hero.soon { background: var(--warn); color: var(--owarn); }
  .hero.now  { background: var(--ok);   color: var(--ook); }
  .hero.done { background: var(--card); color: var(--var); border: 1px solid var(--line); }
  /* Kopfzeile: Status links, Countdown rechts (bricht auf schmalen Handys um) */
  .hero .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
  .hero .lab { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
  .hero .cd { font-size: 24px; line-height: 32px; font-weight: 500; white-space: nowrap; }
  .hero .cd small { font-size: 14px; font-weight: 400; margin: 0 6px 0 3px; }
  .hero .cd small:last-child { margin-right: 0; }
  .hero .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; padding-top: 14px;
               border-top: 1px solid rgba(0,0,0,0.1); border-top-color: color-mix(in srgb, currentColor 15%, transparent); }
  .hero .ev { font-size: 18px; line-height: 26px; font-weight: 500; }
  .hero .su { font-size: 14px; line-height: 20px; margin-top: 4px; opacity: 0.85; }
  .hero .fin { font-size: 13px; line-height: 20px; margin-top: 12px; display: flex; gap: 4px; align-items: center; }
  .hero .ln { text-align: center; min-width: 56px; border-radius: 16px; padding: 10px 12px; background: rgba(255,255,255,0.55); flex-shrink: 0; }
  .hero .ln b { display: block; font-size: 28px; font-weight: 500; line-height: 32px; }
  .hero .ln span { font-size: 12px; }
  .hero.done .sub2 { font-size: 14px; margin-top: 6px; }
  .tag { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 6px; border: 1px solid currentColor; opacity: 0.8; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }

  /* Liste */
  .list { background: var(--card); border-radius: 24px; overflow: hidden; }
  .li { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; min-height: 72px; }
  .li + .li { border-top: 1px solid var(--line); }
  .li .tm { font-size: 16px; font-weight: 500; }
  .li .hl { font-size: 16px; }
  .li .su { font-size: 14px; color: var(--var); }
  .li .fn { font-size: 13px; color: var(--warnacc); margin-top: 2px; }
  .li .ln { min-width: 48px; height: 48px; border-radius: 12px; background: var(--chip); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .li .ln b { font-size: 20px; font-weight: 500; line-height: 22px; }
  .li .ln span { font-size: 11px; color: var(--var); }
  .li.past { opacity: 0.55; }
  .li.past .ln { background: transparent; color: var(--var); }
  .day { font-size: 14px; font-weight: 500; color: var(--primary); padding: 14px 16px 2px; }
  .day + .li { border-top: 0; }
  .more { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 16px; height: 48px; font-size: 14px; font-weight: 500; color: var(--primary); border-top: 1px solid var(--line); }
  .more .ic.up { transform: rotate(180deg); }
  .list > .more:first-child { border-top: 0; }
  .foot { margin: 40px 16px 0; text-align: center; font-size: 12px; line-height: 18px; color: var(--var); }
  .foot a { color: inherit; }
  .notfound { margin: 20px 16px 0; font-size: 14px; color: var(--var); line-height: 20px; }

  /* Datei-Auswahl (unsichtbares Input, ausgelöst über <label for="fileInput">) */
  .switch.drag, .btnf.drag { outline: 3px solid var(--primary); outline-offset: 3px; }
  .file-input { display: none; }

  /* Erster Start */
  .empty { text-align: center; padding: 40px 32px 0; }
  .empty .big { width: 96px; height: 96px; border-radius: 50%; background: var(--pc); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .empty .big .ic { width: 48px; height: 48px; }
  .empty h2 { font-size: 22px; font-weight: 400; margin-bottom: 8px; }
  .empty p { font-size: 14px; color: var(--var); line-height: 20px; margin-bottom: 24px; }
  .btnf { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px 0 16px; border-radius: 24px; background: var(--primary); color: var(--on-primary); font-size: 15px; font-weight: 500; cursor: pointer; }
  .hint { font-size: 12px; color: var(--var); margin-top: 14px; }
  .steps { text-align: left; background: var(--card); border-radius: 24px; margin: 36px 0 0; padding: 6px 0; }
  .st { display: flex; gap: 14px; align-items: center; padding: 10px 16px; font-size: 14px; color: var(--var); }
  .st b { width: 28px; height: 28px; border-radius: 50%; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--on); font-weight: 500; flex-shrink: 0; }

  /* Bottom-Sheet und Dialog */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.32); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; background: var(--sheet); border-radius: 28px 28px 0 0; padding: 8px 0 calc(20px + env(safe-area-inset-bottom)); z-index: 41; max-height: 80vh; overflow-y: auto; }
  .handle { width: 32px; height: 4px; border-radius: 2px; background: #747775; margin: 14px auto 18px; }
  .sheet h3 { font-size: 16px; font-weight: 500; padding: 0 24px 8px; }
  .mi { display: flex; align-items: center; gap: 16px; padding: 0 12px 0 24px; min-height: 64px; width: 100%; text-align: left; }
  .mi .x { flex: 1; min-width: 0; }
  .mi .a { font-size: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mi .b { font-size: 14px; color: var(--var); }
  .mi > .ic { color: var(--var); }
  .mi.sel { background: var(--sc); color: var(--osc); margin: 0 12px; border-radius: 32px; padding-left: 12px; width: calc(100% - 24px); }
  .mi.sel > .ic, .mi.sel .b { color: var(--osc); }
  .mi.act { color: var(--primary); cursor: pointer; } .mi.act > .ic { color: var(--primary); }
  .divi { height: 1px; background: var(--outline); margin: 8px 24px; opacity: 0.6; }
  .dlg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(100% - 48px); max-width: 400px; background: var(--sheet); border-radius: 28px; padding: 24px; z-index: 41; }
  .dlg .hic { color: var(--primary); display: flex; justify-content: center; margin-bottom: 14px; }
  .dlg h3 { font-size: 24px; font-weight: 400; text-align: center; margin-bottom: 14px; }
  .dlg p { font-size: 14px; color: var(--var); line-height: 20px; margin-bottom: 18px; }
  .tf { position: relative; }
  .tf input { width: 100%; height: 56px; border: 1px solid var(--outline); border-radius: 4px; padding: 0 16px; font: inherit; font-size: 16px; color: var(--on); background: transparent; outline: none; }
  .tf input:focus { border: 2px solid var(--primary); padding: 0 15px; }
  .tf label { position: absolute; top: -9px; left: 12px; background: var(--sheet); padding: 0 4px; font-size: 12px; color: var(--var); }
  .tf input:focus + label { color: var(--primary); }
  .help { font-size: 12px; color: var(--var); padding: 4px 16px 0; min-height: 20px; }
  .kidrow { display: flex; align-items: center; gap: 12px; padding: 4px 0; font-size: 16px; }
  .kidrow span { flex: 1; }
  .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .tb { height: 40px; padding: 0 12px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: var(--primary); border-radius: 20px; }
  .tb.f { background: var(--primary); color: var(--on-primary); padding: 0 24px; }
  .inl { display: inline-block; vertical-align: -3px; }
  .tb:disabled { opacity: 0.38; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>Schwimmplan</h1>
    <button class="ib" id="menuBtn" aria-label="Menü" data-ic="more"></button>
  </header>
  <div class="menu" id="menu" hidden>
    <button type="button" id="menuInstall" hidden><span data-ic="install"></span>App installieren</button>
    <label class="mitem" for="fileInput"><span data-ic="file"></span>Wettkampf hinzufügen</label>
    <button type="button" id="menuKids"><span data-ic="person"></span>Kinder verwalten</button>
  </div>
  <main id="content"></main>
  <footer class="foot">(Private Website · Nur private Nutzung · Kontakt: <a href="mailto:joerg@schiller.guru">joerg@schiller.guru</a> · v15)</footer>
</div>
<input type="file" accept="application/pdf" id="fileInput" class="file-input">
<div id="overlay"></div>
<div class="snack" id="snack" hidden></div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // Material-Icons (Pfade aus material.io), inline damit sie offline funktionieren
  const ICONS = {
    install:'M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z',
    share:  'M16 5l-1.42 1.42-1.59-1.59V16h-1.98V4.83L9.42 6.42 8 5l4-4 4 4zm4 5v11c0 1.1-.9 2-2 2H6c-1.11 0-2-.9-2-2V10c0-1.11.89-2 2-2h3v2H6v11h12V10h-3V8h3c1.1 0 2 .89 2 2z',
    check:  'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
    add:    'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
    more:   'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
    drop:   'M7 10l5 5 5-5z',
    file:   'M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 14h-3v3h-2v-3H8v-2h3v-3h2v3h3v2zm-3-7V3.5L18.5 9H13z',
    clock:  'M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z',
    done:   'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z',
    del:    'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
    event:  'M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z',
    person: 'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',
    trophy: 'M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z',
    pool:   'M22 21c-1.11 0-1.73-.37-2.18-.64-.37-.22-.6-.36-1.15-.36-.56 0-.78.13-1.15.36-.46.27-1.07.64-2.18.64s-1.73-.37-2.18-.64c-.37-.22-.6-.36-1.15-.36-.56 0-.78.13-1.15.36-.46.27-1.08.64-2.19.64-1.11 0-1.73-.37-2.18-.64-.37-.23-.6-.36-1.15-.36s-.78.13-1.15.36c-.46.27-1.08.64-2.19.64v-2c.56 0 .78-.13 1.15-.36.46-.27 1.08-.64 2.19-.64s1.73.37 2.18.64c.37.23.59.36 1.15.36.56 0 .78-.13 1.15-.36.46-.27 1.08-.64 2.19-.64 1.11 0 1.73.37 2.18.64.37.22.6.36 1.15.36s.78-.13 1.15-.36c.45-.27 1.07-.64 2.18-.64s1.73.37 2.18.64c.37.23.59.36 1.15.36v2zm0-4.5c-1.11 0-1.73-.37-2.18-.64-.37-.22-.6-.36-1.15-.36-.56 0-.78.13-1.15.36-.45.27-1.07.64-2.18.64s-1.73-.37-2.18-.64c-.37-.22-.6-.36-1.15-.36-.56 0-.78.13-1.15.36-.45.27-1.07.64-2.18.64s-1.73-.37-2.18-.64c-.37-.22-.6-.36-1.15-.36s-.78.13-1.15.36c-.47.27-1.09.64-2.2.64v-2c.56 0 .78-.13 1.15-.36.45-.27 1.07-.64 2.18-.64s1.73.37 2.18.64c.37.22.6.36 1.15.36.56 0 .78-.13 1.15-.36.45-.27 1.07-.64 2.18-.64s1.73.37 2.18.64c.37.22.6.36 1.15.36s.78-.13 1.15-.36c.45-.27 1.07-.64 2.18-.64s1.73.37 2.18.64c.37.22.6.36 1.15.36v2zM8.67 12c.56 0 .78-.13 1.15-.36.46-.27 1.08-.64 2.19-.64 1.11 0 1.73.37 2.18.64.37.22.6.36 1.15.36s.78-.13 1.15-.36c.12-.07.26-.15.41-.23L10.48 5C8.93 3.45 7.5 2.99 5 3v2.5c1.82-.01 2.89.39 4 1.5l1 1-3.25 3.25c.31.12.56.27.77.39.37.23.59.36 1.15.36z',
  };
  function ic(name, cls = '') {
    return `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;
  }
  document.querySelectorAll('[data-ic]').forEach(el => el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic)));

  // ── Gespeicherte Wettkämpfe ─────────────────────────────────────────────────
  // Hochgeladene PDFs werden lokal im Browser (IndexedDB) gespeichert – sie verlassen
  // das Gerät nicht. Zusätzlich wird das Parse-Ergebnis abgelegt, damit das Öffnen
  // schnell geht; ändert sich der Parser, PARSER_VERSION hochzählen → neu einlesen.
  const PARSER_VERSION = 1;

  // Optional: PDFs neben index.html legen und hier eintragen, z. B.
  // { name: 'Wettkampfname', subtitle: 'Ort · Datum', file: 'datei.pdf' }
  // Achtung: alles im Repo ist über GitHub Pages öffentlich.
  const PRESETS = [];

  const store = {
    db: null,
    open() {
      if (this.db) return this.db;
      this.db = new Promise((resolve, reject) => {
        const req = indexedDB.open('schwimmplan', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('competitions', { keyPath: 'id' });
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
      return this.db;
    },
    async run(mode, fn) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction('competitions', mode);
        const req = fn(tx.objectStore('competitions'));
        tx.oncomplete = () => resolve(req && req.result);
        tx.onerror    = () => reject(tx.error);
        tx.onabort    = () => reject(tx.error);
      });
    },
    all()     { return this.run('readonly',  os => os.getAll()); },
    get(id)   { return this.run('readonly',  os => os.get(id)); },
    put(rec)  { return this.run('readwrite', os => os.put(rec)); },
    del(id)   { return this.run('readwrite', os => os.delete(id)); },
  };

  // ── Zustand ─────────────────────────────────────────────────────────────────
  let savedComps      = [];        // Metadaten der gespeicherten Uploads (ohne PDF-Daten)
  let activeId        = null;      // 'preset:<i>' oder 'upload:<key>'
  let allStarts       = [];
  let competitionInfo = {};
  let names           = [];        // Kinder (localStorage)
  let activeNames     = new Set(); // per Filter-Chip eingeblendet
  let loading         = false;
  let errorMsg        = '';
  let ready           = false;     // gespeicherte Liste geladen
  const expandedPast  = new Set(); // Kinder, bei denen „vorbei“ aufgeklappt ist

  function compList() {
    const presets = PRESETS.map((p, i) => ({ id: 'preset:' + i, name: p.name, subtitle: p.subtitle, preset: true }));
    const uploads = [...savedComps]
      .sort((a, b) => b.addedAt - a.addedAt)
      .map(c => ({ id: c.id, name: c.name, subtitle: c.date || c.fileName, preset: false }));
    return [...uploads, ...presets];
  }

  function setActive(id) {
    activeId = id;
    try { id ? localStorage.setItem('schwimmplan_active', id) : localStorage.removeItem('schwimmplan_active'); } catch (e) {}
  }

  async function withLoading(fn) {
    errorMsg = '';
    loading  = true;
    allStarts = [];
    render();
    try {
      await fn();
    } catch (err) {
      errorMsg = err.message;
    } finally {
      loading = false;
      render();
    }
  }

  function showParsed(parsed) {
    competitionInfo = parsed.competition;
    allStarts       = parsed.starts;
  }

  async function parseBuffer(buffer) {
    const parsed = parseEasyWk(await extractTextFromBuffer(buffer));
    if (parsed.starts.length === 0)
      throw new Error('Keine Starts gefunden – ist das eine EasyWk-Meldeergebnis-PDF?');
    return parsed;
  }

  function openCompetition(id) {
    setActive(id);
    return withLoading(async () => {
      if (id.startsWith('preset:')) {
        const preset = PRESETS[parseInt(id.slice(7))];
        if (!preset) throw new Error('Wettkampf nicht gefunden.');
        const response = await fetch(preset.file);
        if (!response.ok) throw new Error('Datei nicht gefunden: ' + preset.file);
        showParsed(await parseBuffer(await response.arrayBuffer()));
        return;
      }
      const rec = await store.get(id);
      if (!rec) { setActive(null); throw new Error('Gespeicherter Wettkampf nicht mehr vorhanden.'); }
      if (rec.parserVersion !== PARSER_VERSION || !rec.parsed) {
        rec.parsed = await parseBuffer(rec.pdf.slice(0));
        rec.parserVersion = PARSER_VERSION;
        store.put(rec).catch(() => {});
      }
      showParsed(rec.parsed);
    });
  }

  async function deleteCompetition(id) {
    const comp = savedComps.find(c => c.id === id);
    if (!comp || !confirm(`„${comp.name}“ vom Gerät löschen?`)) return;
    try { await store.del(id); } catch (e) {}
    savedComps = savedComps.filter(c => c.id !== id);
    if (activeId === id) {
      setActive(null);
      allStarts = [];
      competitionInfo = {};
      const next = compList()[0];
      if (next) { closeOverlay(); openCompetition(next.id); return; }
    }
    if (!compList().length) closeOverlay(); else openSheet();
    render();
  }

  async function loadSavedList() {
    try {
      const all = await store.all();
      savedComps = all.map(({ pdf, parsed, ...meta }) => meta);
    } catch (e) {
      savedComps = [];   // z. B. privates Fenster ohne IndexedDB – App läuft trotzdem
    }
  }

  // ── Upload ──────────────────────────────────────────────────────────────────
  // Datei-Auswahl über <label for="fileInput"> (Menü, Auswahlblatt, Startseite);
  // reinziehen geht auf die ganze Seite.
  const fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', e => {
    closeOverlay();
    handleFile(e.target.files[0]);
    e.target.value = '';   // dieselbe Datei erneut auswählbar
  });

  const setDragOver = on => document.querySelectorAll('.switch, .btnf').forEach(el => el.classList.toggle('drag', on));
  document.addEventListener('dragover', e => {
    if (![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault(); setDragOver(true);
  });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) setDragOver(false); });
  document.addEventListener('drop', e => {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault(); setDragOver(false);
    handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) {
      errorMsg = 'Bitte eine PDF-Datei auswählen.'; render(); return;
    }
    processPDF(file);
  }

  // ── EasyWk parser ───────────────────────────────────────────────────────────
  const GENDER_RE = /\s*\b(m[äa]nnlich|weiblich|mixed)\b\s*/i;

  // "50m Brust männlich (Vorlauf) (10 Läufe) (ca. 09:15 Uhr)"
  //   → { base: '50m Brust', gender: 'männlich', round: 'Vorlauf', time: '09:15' }
  function parseEventTitle(title) {
    let rest = title.trim();
    let time = '';
    const t = rest.match(/\s*\(ca\.\s*(\d{1,2}:\d{2})\s*Uhr\)\s*$/);
    if (t) { time = t[1]; rest = rest.slice(0, t.index); }
    rest = rest.replace(/\s*\(\d+\s*L[äa]ufe?\)\s*$/, '');
    let round = '';
    const r = rest.match(/\s*\(([^()]+)\)\s*$/);
    if (r) { round = r[1].trim(); rest = rest.slice(0, r.index); }
    const g = rest.match(GENDER_RE);
    const gender = g ? g[1].toLowerCase() : '';
    const base = rest.replace(GENDER_RE, ' ').replace(/\s+/g, ' ').trim();
    return { base, gender, round, time };
  }

  // Key used to connect a Vorlauf with its Finale(s): "50m Brust|männlich".
  // Only distance + stroke, so "25m Freistil SpeedRace" matches "25m Freistil (SpeedRace Finale)".
  function followUpKey(ev) {
    return ev.base.split(' ').slice(0, 2).join(' ').toLowerCase() + '|' + ev.gender;
  }

  function parseCompetitionHeader(lines) {
    const competition = {};
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^(.*?)\s*\bvom\s+(\d{2}\.\d{2}\.\d{4})(?:\s+bis\s+(\d{2}\.\d{2}\.\d{4}))?/);
      if (!m) continue;
      const name = m[1] || lines[i - 1] || '';
      if (!name || /Meldeergebnis/i.test(name)) continue;
      competition.name = name.trim();
      competition.date = m[3] && m[3] !== m[2] ? `${m[2]} – ${m[3]}` : m[2];
      break;
    }
    return competition;
  }

  function parseEasyWk(text) {
    const lines = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
    const competition = parseCompetitionHeader(lines);

    const starts  = [];
    const program = [];            // Wettkampffolge in Dokument-Reihenfolge (erste Nennung je WK)
    const seenWk  = new Set();
    let currentWk      = null;
    let currentHeat    = '';
    let currentTime    = '';
    let currentDay     = '';
    let currentSection = 0;

    for (const line of lines) {
      // Abschnitt/day header: "Abschnitt 1 - Samstag 26.09.2026"
      const abschnitt = line.match(/^Abschnitt\s+(\d+)\s*[-–]\s*(\S+\s+\d{2}\.\d{2}\.\d{4})/);
      if (abschnitt) { currentSection = parseInt(abschnitt[1]); currentDay = abschnitt[2]; continue; }

      // Wettkampf header: "Wettkampf 5 - 50m Schmetterling männlich (Vorlauf) (6 Läufe) (ca. 10:26 Uhr)"
      const wk = line.match(/^Wettkampf\s+(\d+)\s*[-–]\s*(.+)$/);
      if (wk) {
        const nr = parseInt(wk[1]);
        currentWk = { nr, ...parseEventTitle(wk[2]), day: currentDay, section: currentSection };
        if (!seenWk.has(nr)) { seenWk.add(nr); program.push(currentWk); }
        continue;
      }

      // Heat header: "Lauf 3/7 - ca. 09:42 Uhr"
      const heat = line.match(/Lauf\s+(\d+)\/(\d+)\s*[-–]\s*ca\.\s*(\d{1,2}:\d{2})\s*Uhr/);
      if (heat) {
        currentHeat = `${heat[1]}/${heat[2]}`;
        currentTime = heat[3];
        continue;
      }

      // Format A: "Bahn 3 Max Mustermann (M) 2016 SC Beispielstadt 00:57,66"
      // Format B: "Bahn 1   Mustermann, Max   2016   SC Beispielstadt   00:48,30"
      // Format C: "Bahn 3   Erika Musterfrau   2003 | S10   SV Musterhausen   3,5,H,12+   02:47,07"
      const bahnA = line.match(/^Bahn\s+(\d+)\s+(.+?)\s+\((W|M)\)\s+(\d{4})\s+(.+?)\s+(\d{2}:\d{2},\d{2})$/);
      const bahnB = !bahnA && line.match(/^Bahn\s+(\d+)\s+([A-ZÀ-ÿa-z][^,]+,[^\d]+?)\s+(\d{4})\s+(.+?)\s+(\d{2}:\d{2},\d{2})$/);
      const bahnC = !bahnA && !bahnB && line.match(/^Bahn\s+(\d+)\s+(.+?)\s+(\d{4})(?:\s*\|\s*\S+)?\s+(.+?)\s+(\d{2}:\d{2},\d{2})$/);
      if ((bahnA || bahnB || bahnC) && currentWk) {
        const b = bahnA || bahnB || bahnC;
        let rawName = b[2].trim();
        if (rawName.includes(',')) {
          const parts = rawName.split(',');
          rawName = parts[1].trim() + ' ' + parts[0].trim();
        }
        // Exceptions-Spalte (z. B. "3,5,H,12+") vom Vereinsnamen trennen
        const club = (bahnA ? bahnA[5] : (bahnB ? bahnB[4] : bahnC[4]))
          .replace(/\s+[\dA-Z+]+(?:,[\dA-Z+]+)+$/, '').trim();
        starts.push({
          laneNum:       parseInt(b[1]),
          name:          rawName,
          gender:        bahnA ? bahnA[3] : '',
          jg:            bahnA ? bahnA[4] : (bahnB ? bahnB[3] : bahnC[3]),
          club,
          meldezeit:     bahnA ? bahnA[6] : (bahnB ? bahnB[5] : bahnC[5]),
          event:         currentWk.base,
          round:         currentWk.round,
          wettkampfNr:   currentWk.nr,
          heat:          currentHeat,
          time:          currentTime,
          day:           currentDay,
          section:       currentSection,
          followUps:     [],
        });
      }
    }

    attachFollowUps(starts, program);
    return { competition, starts };
  }

  // Finals and further rounds are listed in the Wettkampffolge without heats (the
  // qualified swimmers are not known yet). For every Vorlauf start we look them up
  // in the same Abschnitt and estimate the time window from the neighbouring events.
  function attachFollowUps(starts, program) {
    const withEntries = new Set(starts.map(s => s.wettkampfNr));
    const byNr = new Map(program.map(ev => [ev.nr, ev]));

    starts.forEach(s => {
      if (!/vorlauf/i.test(s.round)) return;
      const heat = byNr.get(s.wettkampfNr);
      if (!heat) return;
      const key = followUpKey(heat);
      const seenKinds = new Set();
      program.forEach((ev, idx) => {
        if (ev === heat || ev.section !== heat.section || withEntries.has(ev.nr)) return;
        if (!ev.round || /vorlauf/i.test(ev.round) || followUpKey(ev) !== key) return;
        // Only the first of "1. Runde", "2. Runde", … – the rest follows directly after.
        const kind = ev.round.replace(/\d+\.?\s*/g, '').toLowerCase();
        if (seenKinds.has(kind)) return;
        seenKinds.add(kind);

        let from = '', to = '';
        for (let i = idx - 1; i >= 0 && program[i].section === ev.section; i--)
          if (program[i].time) { from = program[i].time; break; }
        for (let i = idx + 1; i < program.length && program[i].section === ev.section; i++)
          if (program[i].time) { to = program[i].time; break; }

        const extra = ev.base.split(' ').slice(2).join(' ');
        s.followUps.push({ nr: ev.nr, label: extra ? `${extra} (${ev.round})` : ev.round, from, to });
      });
    });
  }

  // ── PDF einlesen ────────────────────────────────────────────────────────────
  async function extractTextFromBuffer(buffer) {
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    const allLines = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page    = await pdf.getPage(p);
      const content = await page.getTextContent();
      const byY = new Map();
      for (const item of content.items) {
        const y = Math.round(item.transform[5]);
        if (!byY.has(y)) byY.set(y, []);
        byY.get(y).push({ x: item.transform[4], str: item.str });
      }
      const sortedYs = [...byY.keys()].sort((a, b) => b - a);
      for (const y of sortedYs) {
        const items = byY.get(y).sort((a, b) => a.x - b.x);
        allLines.push(items.map(i => i.str).join(' '));
      }
    }
    return allLines.join('\n');
  }

  async function processPDF(file) {
    setActive(null);
    await withLoading(async () => {
      const buffer = await file.arrayBuffer();
      const parsed = await parseBuffer(buffer.slice(0));   // PDF.js übernimmt den Buffer
      showParsed(parsed);

      const c   = parsed.competition;
      const key = c.name ? `${c.name}|${c.date || ''}` : `${file.name}|${file.size}`;
      const rec = {
        id: 'upload:' + key,
        name: c.name || file.name.replace(/\.pdf$/i, ''),
        date: c.date || '',
        fileName: file.name,
        addedAt: Date.now(),
        parserVersion: PARSER_VERSION,
        parsed,
        pdf: buffer,
      };
      try {
        await store.put(rec);
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        const { pdf, parsed: _p, ...meta } = rec;
        savedComps = [...savedComps.filter(x => x.id !== rec.id), meta];
        setActive(rec.id);
        showSnack(`${shortName(rec.name)} gespeichert`);
      } catch (e) {
        showSnack('PDF konnte auf diesem Gerät nicht gespeichert werden (privates Fenster?)');
      }
    });
  }

  // ── Kinder ──────────────────────────────────────────────────────────────────
  // Gespeichert werden alle Kinder und die per Chip ausgeblendeten (neue Kinder sind so immer an)
  function saveNames() {
    try {
      localStorage.setItem('schwimmplan_names', JSON.stringify(names));
      localStorage.setItem('schwimmplan_hidden', JSON.stringify(names.filter(n => !activeNames.has(n))));
    } catch (e) {}
  }

  function nameMatches(query, swimmerName) {
    const parts = query.toLowerCase().split(/\s+/).filter(Boolean);
    return parts.length > 0 && parts.every(p => swimmerName.toLowerCase().includes(p));
  }

  function addName(val) {
    val = val.trim();
    if (!val || names.includes(val)) return;
    names.push(val);
    activeNames.add(val);
    saveNames();
    render();
  }

  function removeName(n) {
    names = names.filter(x => x !== n);
    activeNames.delete(n);
    saveNames();
    render();
  }

  function toggleName(n) {
    activeNames.has(n) ? activeNames.delete(n) : activeNames.add(n);
    saveNames();
    render();
  }

  // ── Countdown ──────────────────────────────────────────────────────────────
  const SOON_MIN = 30;   // ab hier gelb „Gleich dran“
  const NOW_MIN  = 10;   // so lange nach der ca.-Zeit bleibt „Jetzt dran“ stehen

  function timeToMin(t) {
    if (!t) return 9999;
    const m = t.match(/(\d{1,2}):(\d{2})/);
    return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : 9999;
  }

  // Absoluter Zeitpunkt eines Starts (ms) aus Tag ("Samstag 26.09.2026") bzw.
  // Wettkampfdatum und ca.-Uhrzeit; null wenn nicht bestimmbar.
  function startAt(s) {
    const d = (s.day || competitionInfo.date || '').match(/(\d{2})\.(\d{2})\.(\d{4})/);
    const t = (s.time || '').match(/(\d{1,2}):(\d{2})/);
    if (!d || !t) return null;
    return new Date(+d[3], +d[2] - 1, +d[1], +t[1], +t[2]).getTime();
  }

  // Markiert pro Kind vergangene Starts und den nächsten (state: next | soon | now).
  function countdownStates(starts, now) {
    const states = new Map();
    let found = false;
    for (const s of starts) {
      const at = startAt(s);
      if (at === null || found) continue;
      if (now >= at + NOW_MIN * 60000) { states.set(s, { past: true }); continue; }
      found = true;
      const mins = Math.ceil((at - now) / 60000);
      states.set(s, { state: mins <= 0 ? 'now' : mins <= SOON_MIN ? 'soon' : 'next', mins });
    }
    return states;
  }

  function countdownText(mins) {
    const d = Math.floor(mins / 1440), h = Math.floor(mins % 1440 / 60), m = mins % 60;
    const part = (n, u) => `${n}<small>${u}</small>`;
    if (d) return 'in ' + part(d, d === 1 ? 'Tag' : 'Tage') + (h ? part(h, 'Std') : '');
    if (h) return 'in ' + part(h, 'Std') + part(m, 'Min');
    return 'in ' + part(m, 'Min');
  }

  // ── Darstellung ─────────────────────────────────────────────────────────────
  const NEXT_LABEL = { next: 'Nächster Start', soon: 'Gleich dran', now: 'Jetzt dran' };

  function shortName(n) { return n.length > 40 ? n.slice(0, 38) + '…' : n; }
  function weekday(day) { return (day || '').split(' ')[0]; }

  function followUpText(f) {
    const win = f.from && f.to ? `ca. ${f.from}–${f.to}` : (f.from ? `nach ca. ${f.from}` : '');
    return `${esc(f.label)} möglich${win ? ', ' + win : ''}`;
  }

  function laneHtml(s) { return `<div class="ln"><b>${s.laneNum}</b><span>Bahn</span></div>`; }

  function heroHtml(s, cd, multiDay) {
    const round = s.round ? `<span class="tag">${esc(s.round)}</span>` : '';
    const mz    = s.meldezeit && s.meldezeit !== '00:00,00' ? ` · ${esc(s.meldezeit)}` : '';
    const fin   = s.followUps.map(f => `<div class="fin">${ic('trophy', 's18')} ${followUpText(f)}</div>`).join('');
    const label = NEXT_LABEL[cd.state] + (multiDay && cd.state === 'next' ? ' · ' + esc(weekday(s.day)) : '');
    return `<div class="hero ${cd.state}">
      <div class="top">
        <div class="lab">${ic('clock', 's18')} ${label}</div>
        <div class="cd">${cd.state === 'now' ? 'Jetzt' : countdownText(cd.mins)}</div>
      </div>
      <div class="row">
        <div><div class="ev">${esc(s.time)} · ${esc(s.event)} ${round}</div>
          <div class="su">WK ${s.wettkampfNr} · Lauf ${esc(s.heat)}${mz}</div>${fin}</div>
        ${laneHtml(s)}
      </div>
    </div>`;
  }

  function itemHtml(s, past) {
    const round = s.round ? ` · ${esc(s.round)}` : '';
    const fin   = past ? '' : s.followUps.map(f => `<div class="fn">${followUpText(f)}</div>`).join('');
    return `<div class="li${past ? ' past' : ''}">
      <div class="tm">${esc(s.time)}</div>
      <div><div class="hl">${esc(s.event)}</div><div class="su">WK ${s.wettkampfNr} · Lauf ${esc(s.heat)}${round}${past ? ' · Vorbei' : ''}</div>${fin}</div>
      ${past ? `<div class="ln">${ic('done')}</div>` : laneHtml(s)}
    </div>`;
  }

  function swimmerHtml(data, key, colorIdx, now) {
    const starts = data.starts;
    const cds    = countdownStates(starts, now);
    const multiDay = new Set(starts.map(s => s.day)).size > 1;
    const hero   = starts.find(s => cds.get(s) && !cds.get(s).past);
    const past   = starts.filter(s => cds.get(s) && cds.get(s).past);
    const rest   = starts.filter(s => s !== hero && !past.includes(s));

    let html = `<section class="sec">
      <div class="sh"><div class="av av${colorIdx % 4}">${esc(data.name.charAt(0))}</div>
        <div><div class="n">${esc(data.name)}</div>
        <div class="s">${esc(data.club)} · ${starts.length} Start${starts.length !== 1 ? 's' : ''}</div></div></div>`;

    if (hero) {
      html += heroHtml(hero, cds.get(hero), multiDay);
    } else if (past.length === starts.length) {
      const last = starts[starts.length - 1];
      html += `<div class="hero done"><div class="lab">${ic('done', 's18')} ${starts.length === 1 ? 'Start' : `Alle ${starts.length} Starts`} geschafft</div>
        <div class="sub2">Letzter Start: ${esc(last.time)} · ${esc(last.event)}</div></div>`;
    }

    let items = '';
    let lastDay = hero ? hero.day : null;
    rest.forEach(s => {
      if (multiDay && s.day !== lastDay) items += `<div class="day">${esc(s.day)}</div>`;
      lastDay = s.day;
      items += itemHtml(s, false);
    });
    if (past.length) {
      const open = expandedPast.has(key);
      items += `<button class="more" data-past="${esc(key)}" aria-expanded="${open}">
        <span>${past.length} Start${past.length !== 1 ? 's' : ''} vorbei</span>${ic('drop', open ? 'up' : '')}</button>`;
      if (open) items += past.map(s => itemHtml(s, true)).join('');
    }
    if (items) html += `<div class="list">${items}</div>`;
    return html + `</section>`;
  }

  function resultsHtml() {
    if (!allStarts.length) return '';
    if (!names.length) {
      return `<p class="notfound">Tippe auf „＋ Kind“ und gib den Namen deines Kindes ein – dann erscheinen hier seine Starts.</p>`;
    }
    const swimmers = new Map();
    const found = new Set();
    allStarts.forEach(s => {
      const n = [...activeNames].find(q => nameMatches(q, s.name));
      if (!n) return;
      found.add(n);
      const key = s.name + '|' + s.jg;
      if (!swimmers.has(key)) swimmers.set(key, { name: s.name, club: s.club, color: names.indexOf(n), starts: [] });
      swimmers.get(key).starts.push(s);
    });
    swimmers.forEach(d => d.starts.sort((a, b) =>
      (a.section - b.section) || (timeToMin(a.time) - timeToMin(b.time))));

    const now = Date.now();
    let html = '';
    [...swimmers.entries()].forEach(([key, d], i) => { html += swimmerHtml(d, key, d.color, now); });
    const missing = [...activeNames].filter(n => !found.has(n));
    if (missing.length) {
      html += `<p class="notfound">Nicht gefunden in diesem Wettkampf: ${missing.map(esc).join(', ')}</p>`;
    }
    return html;
  }

  function emptyHtml() {
    return `<div class="empty">
      <div class="big">${ic('pool')}</div>
      <h2>Starts auf einen Blick</h2>
      <p>Lade das Meldeergebnis des Wettkampfs als PDF (aus EasyWk). Die Datei bleibt auf deinem Handy.</p>
      <label class="btnf" for="fileInput">${ic('file')} PDF auswählen</label>
      <div class="hint">oder am Computer hierher ziehen</div>
      <div class="steps">
        <div class="st"><b>1</b>Meldeergebnis-PDF auswählen</div>
        <div class="st"><b>2</b>Namen deiner Kinder eingeben</div>
        <div class="st"><b>3</b>Starts mit Uhrzeit, Lauf und Bahn sehen</div>
      </div>
    </div>`;
  }

  function render() {
    const comps   = compList();
    const hasData = comps.length > 0 || allStarts.length > 0;
    const firstRun = ready && !hasData && !loading;
    let html = '';

    if (errorMsg) html += `<div class="errbox">${esc(errorMsg)}</div>`;

    if (firstRun) {
      html += emptyHtml();
    } else if (ready || loading) {
      const active = comps.find(c => c.id === activeId);
      if (comps.length) {
        html += `<button class="switch" id="switchBtn"><span>${esc(active ? active.name : 'Wettkampf auswählen')}</span>${ic('drop')}</button>`;
      }
      html += `<div class="chips">` + names.map(n => `<button class="fc${activeNames.has(n) ? ' on' : ''}" data-kid="${esc(n)}">${activeNames.has(n) ? ic('check', 's18') : ''}${esc(n)}</button>`).join('')
        + `<button class="fc add" id="addKid">${ic('add', 's18')} Kind</button></div>`;
      if (loading) html += `<div class="prog"><i></i></div><div class="prog-text">PDF wird gelesen …</div>`;
      else html += resultsHtml();
    }

    const content = document.getElementById('content');
    content.innerHTML = html;

    content.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => toggleName(b.dataset.kid));
    content.querySelectorAll('[data-past]').forEach(b => b.onclick = () => {
      const k = b.dataset.past;
      expandedPast.has(k) ? expandedPast.delete(k) : expandedPast.add(k);
      render();
    });
    const sw = document.getElementById('switchBtn'); if (sw) sw.onclick = openSheet;
    const ak = document.getElementById('addKid');    if (ak) ak.onclick = openKidDialog;
  }

  // ── Menü, Auswahlblatt, Dialog, Snackbar ─────────────────────────────────────
  const overlay = document.getElementById('overlay');
  function closeOverlay() { overlay.innerHTML = ''; }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeOverlay(); closeMenu(); } });

  const menu = document.getElementById('menu');
  function closeMenu() { menu.hidden = true; }
  document.getElementById('menuBtn').onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
  document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
  menu.querySelector('label').addEventListener('click', closeMenu);
  document.getElementById('menuKids').onclick = () => { closeMenu(); openKidDialog(); };

  function openSheet() {
    const items = compList().map(c => `
      <div class="mi${c.id === activeId ? ' sel' : ''}" data-open="${esc(c.id)}" role="button">
        ${ic('event')}
        <div class="x"><div class="a">${esc(c.name)}</div><div class="b">${esc(c.subtitle)}</div></div>
        ${c.id === activeId ? ic('check') : ''}
        ${c.preset ? '' : `<button class="ib" data-del="${esc(c.id)}" aria-label="${esc(c.name)} löschen">${ic('del')}</button>`}
      </div>`).join('');
    overlay.innerHTML = `<div class="scrim" data-close></div>
      <div class="sheet" role="dialog" aria-label="Wettkampf">
        <div class="handle"></div><h3>Wettkampf</h3>${items}
        <div class="divi"></div>
        <label class="mi act" for="fileInput">${ic('file')}<div class="x"><div class="a">Wettkampf hinzufügen</div><div class="b">Meldeergebnis als PDF</div></div></label>
      </div>`;
    overlay.querySelector('[data-close]').onclick = closeOverlay;
    overlay.querySelectorAll('[data-open]').forEach(el => el.onclick = e => {
      if (e.target.closest('[data-del]')) return;
      closeOverlay();
      if (el.dataset.open !== activeId || !allStarts.length) openCompetition(el.dataset.open);
    });
    overlay.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteCompetition(b.dataset.del));
  }

  function openKidDialog() {
    const list = names.length ? `<div class="divi" style="margin:18px 0 8px"></div>` + names.map(n => `
      <div class="kidrow"><span>${esc(n)}</span><button class="ib" data-rm="${esc(n)}" aria-label="${esc(n)} entfernen">${ic('del')}</button></div>`).join('') : '';
    overlay.innerHTML = `<div class="scrim" data-close></div>
      <div class="dlg" role="dialog" aria-label="Kind hinzufügen">
        <div class="hic">${ic('person')}</div>
        <h3>Kind hinzufügen</h3>
        <p>Name so, wie er im Meldeergebnis steht. Vor- oder Nachname reicht meist.</p>
        <div class="tf"><input id="kidInput" autocomplete="off" autocapitalize="words"><label for="kidInput">Name</label></div>
        <div class="help" id="kidHelp"></div>
        ${list}
        <div class="acts"><button class="tb" data-close>Abbrechen</button><button class="tb f" id="kidOk" disabled>Hinzufügen</button></div>
      </div>`;
    const input = document.getElementById('kidInput');
    const help  = document.getElementById('kidHelp');
    const ok    = document.getElementById('kidOk');
    const update = () => {
      const v = input.value.trim();
      ok.disabled = !v;
      if (!v || !allStarts.length) { help.textContent = ''; return; }
      const hits = allStarts.filter(s => nameMatches(v, s.name));
      const people = new Set(hits.map(s => s.name));
      help.textContent = !hits.length
        ? 'Im aktuellen Wettkampf nicht gefunden'
        : `Gefunden: ${hits.length} Start${hits.length !== 1 ? 's' : ''}` + (people.size > 1 ? ` (${people.size} Personen)` : ` · ${[...people][0]}`);
    };
    const submit = () => { if (input.value.trim()) { addName(input.value); closeOverlay(); } };
    input.addEventListener('input', update);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    ok.onclick = submit;
    overlay.querySelectorAll('[data-close]').forEach(el => el.onclick = closeOverlay);
    overlay.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { removeName(b.dataset.rm); openKidDialog(); });
    input.focus();
  }

  // ── App installieren ────────────────────────────────────────────────────────
  // Chrome/Edge/Samsung melden über `beforeinstallprompt`, dass die Seite installierbar ist;
  // das Ereignis wird aufgehoben und beim Tipp auf „App installieren“ ausgelöst.
  // Safari (iPhone/iPad) kennt das nicht – dort zeigt der Menüeintrag eine Anleitung.
  // In der installierten App (standalone) erscheint der Eintrag nicht.
  let installPrompt = null;
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const menuInstall = document.getElementById('menuInstall');

  function updateInstallItem() {
    menuInstall.hidden = isStandalone() || !(installPrompt || isIOS);
  }

  window.addEventListener('beforeinstallprompt', e => { installPrompt = e; updateInstallItem(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; updateInstallItem(); showSnack('App installiert'); });

  menuInstall.onclick = async () => {
    closeMenu();
    if (installPrompt) {
      const p = installPrompt;
      installPrompt = null;
      p.prompt();
      try { await p.userChoice; } catch (e) {}
      updateInstallItem();
    } else if (isIOS) {
      openIOSInstallDialog();
    }
  };

  function openIOSInstallDialog() {
    overlay.innerHTML = `<div class="scrim" data-close></div>
      <div class="dlg" role="dialog" aria-label="Als App installieren">
        <div class="hic">${ic('install')}</div>
        <h3>Als App installieren</h3>
        <p>Tippe in Safari unten auf <span class="inl">${ic('share', 's18')}</span> <b>Teilen</b> und dann auf
          <b>„Zum Home-Bildschirm“</b>. Danach startet Schwimmplan wie eine App – auch offline.</p>
        <div class="acts"><button class="tb f" data-close>Verstanden</button></div>
      </div>`;
    overlay.querySelectorAll('[data-close]').forEach(el => el.onclick = closeOverlay);
  }

  updateInstallItem();

  let snackTimer = null;
  function showSnack(msg) {
    const el = document.getElementById('snack');
    el.textContent = msg; el.hidden = false;
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => { el.hidden = true; }, 3500);
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  try {
    names = JSON.parse(localStorage.getItem('schwimmplan_names') || '[]');
    if (!Array.isArray(names)) names = [];
  } catch (e) { names = []; }
  let hidden = [];
  try { hidden = JSON.parse(localStorage.getItem('schwimmplan_hidden') || '[]'); } catch (e) {}
  activeNames = new Set(names.filter(n => !(Array.isArray(hidden) && hidden.includes(n))));
  render();

  // Zuletzt geöffneten Wettkampf wiederherstellen (sonst den neuesten)
  (async () => {
    await loadSavedList();
    ready = true;
    let last = null;
    try { last = localStorage.getItem('schwimmplan_active'); } catch (e) {}
    const list = compList();
    const target = list.some(c => c.id === last) ? last : (list[0] && list[0].id);
    if (target) openCompetition(target); else render();
  })();

  // Countdown live halten: alle 30 s und sofort beim Zurückkehren in die App
  const refresh = () => { if (!document.hidden && !loading) render(); };
  setInterval(refresh, 30000);
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('focus', refresh);

  // Offline-Unterstützung (nur über http(s), nicht bei file://)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
